<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} ?: 'Reven 설문'">Reven 설문</title>
    <link rel="stylesheet" th:href="@{/common/css/app.css}">
    <th:block th:if="${extraHeadLinks != null}" th:utext="${extraHeadLinks}"></th:block>
</head>
<body>
<nav class="admin-gnb" th:fragment="gnb(active)">
    <a class="brand" th:href="@{/admin/home.do}">Reven Admin</a>
    <button class="nav-toggle" type="button" data-nav-toggle aria-controls="globalNavigation" aria-expanded="false">메뉴</button>
    <div class="gnb-links" id="globalNavigation">
        <div th:each="item : ${adminNavigation?.gnbItems()}"
             class="admin-gnb-menu"
             th:classappend="${item.active()} ? ' is-active'">
            <a th:href="@{${item.href()}}" th:text="${item.menuName()}">관리자 메뉴</a>
            <div class="admin-gnb-dropdown" th:if="${!#lists.isEmpty(item.children())}">
                <a th:each="child : ${item.children()}"
                   th:classappend="${child.active()} ? ' is-active'"
                   th:href="@{${child.href()}}"
                   th:text="${child.menuName()}">하위 메뉴</a>
            </div>
        </div>
    </div>
    <div class="gnb-utils">
        <a th:href="@{/surveys/list.do}">사용자 화면</a>
        <form class="gnb-logout-form" th:action="@{/admin/logout.do}" method="post">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="gnb-logout-btn" type="submit">로그아웃</button>
        </form>
    </div>
</nav>

<nav class="public-gnb" th:fragment="publicGnb(active)">
    <a class="brand" th:href="@{/main.do}">Reven</a>
    <button class="nav-toggle" type="button" data-nav-toggle aria-controls="publicGlobalNavigation" aria-expanded="false">메뉴</button>
    <div class="gnb-links public-gnb-links" id="publicGlobalNavigation">
        <div class="gnb-menu" th:classappend="${active == 'news'} ? ' is-active'">
            <a th:href="@{/news/ai/list.do}">뉴스</a>
            <div class="gnb-dropdown">
                <a th:href="@{/news/ai/list.do}">AI</a>
            </div>
        </div>
        <div class="gnb-menu" th:classappend="${active == 'survey'} ? ' is-active'">
            <a th:href="@{/surveys/list.do}">설문</a>
            <div class="gnb-dropdown">
                <a th:href="@{/surveys/list.do}">진행중인 설문</a>
            </div>
        </div>
    </div>
</nav>

<aside class="admin-lnb" th:fragment="lnb(active)" th:if="${adminNavigation?.activeRoot() != null}">
    <div class="lnb-group" th:text="${adminNavigation.activeRoot().menuName()}">설문 운영</div>
    <a th:each="item : ${adminNavigation.lnbItems()}"
       th:classappend="${item.active()} ? 'is-active'"
       th:href="@{${item.href()}}"
       th:text="${item.menuName()}">설문 관리</a>
</aside>

<div class="page-breadcrumb" th:fragment="breadcrumb(depth1, depth2, depth3)">
    <span th:text="${depth1}">1-depth</span>
    <span aria-hidden="true"> &gt; </span>
    <span th:text="${depth2}">2-depth</span>
    <span aria-hidden="true"> &gt; </span>
    <strong th:text="${depth3}">3-depth</strong>
</div>

<footer class="site-footer" th:fragment="footer">
    <span>Reven 설문 운영</span>
</footer>

<th:block th:fragment="scripts">
    <script th:src="@{/common/js/app.js}" defer></script>
</th:block>
</body>
</html>
