<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${survey?.title} ?: '설문 작성')}"></head>
<body>
<!-- screen: 설문 작성 / purpose: 사용자가 인적사항과 설문 답변을 제출하는 화면 / created: 2026-05-23 -->
<header th:replace="~{fragments/layout :: publicGnb('survey')}"></header>
<main class="public-content">

    <!-- 페이지 헤더 시작 -->
    <section class="page-head">
        <h1 th:text="${survey?.title} ?: '설문 작성'">설문 작성</h1>
        <p th:text="${survey?.description}">설문 설명</p>
    </section>
    <!-- 페이지 헤더 끝 -->

    <!-- 알림 시작 -->
    <div class="alert" th:if="${previewMode == true}">관리자 미리보기 화면입니다. 응답은 저장되지 않습니다.</div>
    <div class="alert" th:if="${errors != null and !errors.isEmpty()}">응답 내용을 다시 확인해 주세요.</div>
    <!-- 알림 끝 -->

    <!-- 설문 폼 시작 -->
    <form class="form-stack"
          method="post"
          th:action="${previewMode == true} ? @{/admin/surveys/preview.do(surveyUid=${survey?.surveyUid})} : @{/surveys/submit.do(surveyUid=${survey?.surveyUid})}"
          th:onsubmit="${previewMode == true} ? 'return false' : null">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <section class="content-panel">
            <div class="panel-head">
                <h2>제출자 정보</h2>
            </div>
            <label>
                제출자명
                <span class="required">*</span>
                <input class="form-control" name="submitterName" th:disabled="${previewMode == true}" required>
            </label>
            <label>
                연락처
                <span class="required">*</span>
                <input class="form-control" name="phone" th:disabled="${previewMode == true}" required>
            </label>
        </section>

        <section class="content-panel">
            <div class="panel-head">
                <h2>설문 문항</h2>
            </div>
            <div class="question-list">
                <th:block th:each="field : ${survey?.fields}">
                    <th:block th:replace="~{client/survey/field :: field(field=${field})}"></th:block>
                </th:block>
            </div>
        </section>

        <div class="detail-action-bar">
            <a class="btn btn-neutral" th:href="@{/surveys/list.do}">목록</a>
            <button class="btn btn-register" type="submit" th:if="${previewMode != true}">제출</button>
        </div>
    </form>
    <!-- 설문 폼 끝 -->

</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
