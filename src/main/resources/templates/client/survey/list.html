<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('접수 가능한 설문')}"></head>
<body>
<!-- screen: 설문 목록 / purpose: 사용자가 접수 가능한 설문을 선택하는 화면 / created: 2026-05-23 -->
<header th:replace="~{fragments/layout :: gnb('user')}"></header>
<main class="public-content">
    <div th:replace="~{fragments/layout :: breadcrumb('사용자 화면', '설문', '설문 목록')}"></div>
    <section class="page-head"><h1>접수 가능한 설문</h1><p>진행 중인 설문을 선택해 제출할 수 있습니다.</p></section>
    <section class="survey-card-grid">
        <article class="survey-card" th:each="survey : ${surveys}">
            <span class="badge badge-success">접수중</span>
            <h2 th:text="${survey.title}">설문 제목</h2>
            <p>내용을 작성해 제출해주세요.</p>
            <a class="btn btn-register" th:href="@{/surveys/{id}(id=${survey.surveyUid})}">작성하기</a>
        </article>
        <p class="empty" th:if="${#lists.isEmpty(surveys)}">현재 접수 가능한 설문이 없습니다.</p>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
