<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('관리자 홈')}"></head>
<body>
<!-- screen: 관리자 홈 / purpose: 설문 운영 현황을 요약하는 관리자 첫 화면 / created: 2026-05-23 -->
<header th:replace="~{fragments/layout :: gnb('home')}"></header>
<div class="admin-shell">
    <aside th:replace="~{fragments/layout :: lnb('home')}"></aside>
    <main class="admin-content">
        <div th:replace="~{fragments/layout :: breadcrumb('관리자', '관리자 홈', '대시보드')}"></div>
        <section class="page-head">
            <h1>관리자 홈</h1>
            <p>설문과 제출 이력을 한눈에 확인합니다.</p>
        </section>
        <section class="dashboard-grid" aria-label="설문 운영 요약">
            <article class="metric-card">
                <span>운영중 설문</span>
                <strong th:text="${activeSurveyCount} ?: 0">0</strong>
            </article>
            <article class="metric-card">
                <span>오늘 제출</span>
                <strong th:text="${todaySubmissionCount} ?: 0">0</strong>
            </article>
            <article class="metric-card">
                <span>전체 이력</span>
                <strong th:text="${submissionCount} ?: 0">0</strong>
            </article>
        </section>
        <section class="content-panel no-pad">
            <div class="panel-head">
                <h2>최근 설문 이력</h2>
                <a class="text-link" th:href="@{/admin/survey-submissions/list.do}">more</a>
            </div>
            <div class="table-scroll">
                <table>
                    <thead>
                    <tr><th>순번</th><th>설문명</th><th>제출자명</th><th>상태</th><th>제출일</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="item, stat : ${recentSubmissions}">
                        <td th:text="${stat.count}">1</td>
                        <td><a th:href="@{/admin/survey-submissions/detail.do(submitUid=${item.id})}" th:text="${item.surveyTitle}">설문명</a></td>
                        <td th:text="${item.submitterName}">작성자</td>
                        <td><span class="badge badge-info" th:text="${item.statusText}">접수</span></td>
                        <td th:text="${item.submittedDate}">2026-05-23</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(recentSubmissions)}"><td colspan="5" class="empty">현재 등록된 내용이 없습니다.</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
