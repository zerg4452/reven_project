<!-- screen: 게시판 허브 / purpose: 관리자 게시판 1-depth에서 공지사항, 포토게시판, AI News로 이동하는 화면 / created: 2026-05-27 -->
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin}">
<head>
    <title layout:fragment="title">게시판</title>
</head>
<body>
<th:block layout:fragment="content">


        <!-- 브레드크럼 시작 -->
        <div th:replace="~{fragments/layout :: breadcrumb('관리자', '게시판', '게시판 허브')}"></div>
        <!-- 브레드크럼 끝 -->

        <!-- 페이지 헤더 시작 -->
        <section class="page-head">
            <h1>게시판</h1>
            <p>공지사항, 포토게시판, AI News를 관리합니다.</p>
        </section>
        <!-- 페이지 헤더 끝 -->

        <!-- 게시판 허브 시작 -->
        <section class="board-hub-grid">
            <a class="board-hub-card" th:href="@{/admin/board/notice/list.do}">
                <strong>공지사항</strong>
                <span>공지 등록과 상단 고정, 노출 여부를 관리합니다.</span>
            </a>
            <a class="board-hub-card" th:href="@{/admin/board/photo/list.do}">
                <strong>포토게시판</strong>
                <span>이미지, GIF, WEBP, MP4 첨부를 관리합니다.</span>
            </a>
            <a class="board-hub-card" th:href="@{/admin/board/ai-news/list.do}">
                <strong>AI News</strong>
                <span>AI News 원고와 게시 상태를 관리합니다.</span>
            </a>
        </section>
        <!-- 게시판 허브 끝 -->


</th:block>
</body>
</html>
