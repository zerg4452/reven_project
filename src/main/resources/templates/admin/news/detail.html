<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('뉴스 상세')}"></head>
<body>
<!-- screen: 뉴스 상세 / purpose: 뉴스 원고 내용을 읽기 전용으로 확인하는 화면 / created: 2026-05-23 -->
<header th:replace="~{fragments/layout :: gnb('news')}"></header>
<div class="admin-shell">
    <aside th:replace="~{fragments/layout :: lnb('news')}"></aside>
    <main class="admin-content">
        <div th:replace="~{fragments/layout :: breadcrumb('관리자', '뉴스', '뉴스 상세')}"></div>
        <section class="page-head"><h1>뉴스 상세</h1><p>뉴스 원고와 게시 정보를 확인합니다.</p></section>
        <section class="content-panel">
            <dl class="detail-list"><dt>제목</dt><dd th:text="${news?.title}">제목</dd><dt>상태</dt><dd th:text="${news?.statusText}">게시</dd><dt>게시일</dt><dd th:text="${news?.publishedDate}">2026-05-23</dd><dt>내용</dt><dd th:text="${news?.content}">내용</dd></dl>
        </section>
        <div class="detail-action-bar"><a class="btn btn-neutral" th:href="@{/admin/news/list.do}">목록</a><a class="btn btn-edit" th:href="@{/admin/news/write.do(newsSeq=${news?.id})}">수정</a></div>
    </main>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
