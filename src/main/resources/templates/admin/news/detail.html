<!-- screen: AI News 상세 / purpose: AI News 원고 내용을 읽기 전용으로 확인하는 화면 / created: 2026-05-23 -->
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin}">
<head>
    <title layout:fragment="title">AI News 상세</title>
</head>
<body>
<th:block layout:fragment="content">

    <!-- 브레드크럼 시작 -->
    <div th:replace="~{fragments/layout :: breadcrumb('관리자', '게시판', 'AI News 상세')}"></div>
    <!-- 브레드크럼 끝 -->

    <!-- 페이지 헤더 시작 -->
    <section class="page-head">
        <h1>AI News 상세</h1>
        <p>AI News 원고와 게시 정보를 확인합니다.</p>
    </section>
    <!-- 페이지 헤더 끝 -->

    <!-- 상세 정보 시작 -->
    <section class="content-panel">
        <dl class="detail-list">
            <dt>제목</dt>
            <dd th:text="${news?.title}">제목</dd>
            <dt>상태</dt>
            <dd th:text="${news?.statusText}">게시</dd>
            <dt>게시일</dt>
            <dd th:text="${news?.publishedDate}">2026-05-23</dd>
            <dt>내용</dt>
            <dd th:text="${news?.content}">내용</dd>
        </dl>
    </section>
    <!-- 상세 정보 끝 -->

    <!-- 하단 버튼 시작 -->
    <div class="detail-action-bar">
        <a class="btn btn-neutral" th:href="@{/admin/board/ai-news/list.do}">목록</a>
        <a class="btn btn-edit" th:href="@{/admin/board/ai-news/write.do(newsSeq=${news?.id})}">수정</a>
    </div>
    <!-- 하단 버튼 끝 -->

</th:block>
</body>
</html>
