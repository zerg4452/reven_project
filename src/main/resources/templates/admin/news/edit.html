<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${news?.id} != null ? '뉴스 수정' : '뉴스 등록')}"></head>
<body>
<!-- screen: 뉴스 등록/수정 / purpose: 뉴스 원고와 게시 상태를 등록하거나 수정하는 화면 / created: 2026-05-23 -->
<header th:replace="~{fragments/layout :: gnb('news')}"></header>
<div class="admin-shell">
    <aside class="admin-lnb"><div class="lnb-group">뉴스</div><a class="is-active" th:href="@{/admin/news}">뉴스 관리</a></aside>
    <main class="admin-content">
        <div th:replace="~{fragments/layout :: breadcrumb('관리자', '뉴스', ${news?.id} != null ? '뉴스 수정' : '뉴스 등록')}"></div>
        <section class="page-head"><h1 th:text="${news?.id} != null ? '뉴스 수정' : '뉴스 등록'">뉴스 등록</h1><p>뉴스 원고와 게시 상태를 편집합니다.</p></section>
        <form class="form-stack" method="post">
            <section class="content-panel">
                <label>제목 <span class="required">*</span><input class="form-control" name="title" th:value="${news?.title}" required></label>
                <label>상태<select class="form-control" name="status"><option value="Y">게시</option><option value="N">대기</option></select></label>
                <label>내용<textarea class="form-control" name="content" rows="12" th:text="${news?.content}"></textarea></label>
            </section>
            <div class="detail-action-bar"><a class="btn btn-neutral" th:href="@{/admin/news}">목록</a><button class="btn btn-edit" type="submit">저장</button></div>
        </form>
    </main>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
