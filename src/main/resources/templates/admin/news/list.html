<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('뉴스 관리')}"></head>
<body>
<!-- screen: 뉴스 관리 / purpose: 뉴스 원고를 검색하고 목록으로 관리하는 화면 / created: 2026-05-23 -->
<header th:replace="~{fragments/layout :: gnb('news')}"></header>
<div class="admin-shell">
    <aside class="admin-lnb"><div class="lnb-group">뉴스</div><a class="is-active" th:href="@{/admin/news}">뉴스 관리</a></aside>
    <main class="admin-content">
        <div th:replace="~{fragments/layout :: breadcrumb('관리자', '뉴스', '뉴스 관리')}"></div>
        <section class="page-head"><h1>뉴스 관리</h1><p>뉴스 원고와 게시 상태를 관리합니다.</p></section>
        <form class="search-panel" method="get" th:action="@{/admin/news}">
            <div class="search-row">
                <span class="search-label">게시일자</span>
                <input class="form-control" type="date" name="dateFrom" th:value="${dateFrom}" data-date-default="start">
                <span class="date-separator">~</span>
                <input class="form-control" type="date" name="dateTo" th:value="${dateTo}" data-date-default="end">
            </div>
            <div class="search-row">
                <label class="search-label" for="newsKeywordType">검색조건</label>
                <select class="form-control" id="newsKeywordType" name="keywordType"><option value="all">전체</option><option value="title">제목</option><option value="tag">태그</option></select>
                <label class="search-label" for="newsKeyword">검색어</label>
                <input class="form-control search-keyword" id="newsKeyword" name="keyword" th:value="${keyword}">
                <button class="btn btn-register" type="submit">검색</button>
            </div>
        </form>
        <div class="list-action-bar"><a class="btn btn-register" th:href="@{/admin/news/new}">뉴스 등록</a></div>
        <section class="content-panel no-pad">
            <div class="panel-head"><h2>뉴스 목록</h2><span th:text="|${totalCount ?: 0}개|">0개</span></div>
            <div class="table-scroll">
                <table>
                    <thead><tr><th>순번</th><th>제목</th><th>상태</th><th>게시일</th><th>수정일</th></tr></thead>
                    <tbody>
                    <tr th:each="news, stat : ${newsList}">
                        <td th:text="${stat.count}">1</td>
                        <td><a th:href="@{/admin/news/{id}(id=${news.id})}" th:text="${news.title}">제목</a></td>
                        <td><span class="badge badge-info" th:text="${news.statusText}">게시</span></td>
                        <td th:text="${news.publishedDate}">2026-05-23</td>
                        <td th:text="${news.updatedDate}">2026-05-23</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(newsList)}"><td colspan="5" class="empty">뉴스가 없습니다.</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
