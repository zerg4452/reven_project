<!-- screen: AI News 관리 / purpose: AI News 원고를 검색하고 목록으로 관리하는 화면 / created: 2026-05-23 -->
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin}">
<head>
    <title layout:fragment="title">AI News 관리</title>
</head>
<body>
<th:block layout:fragment="content">


        <!-- 브레드크럼 시작 -->
        <div th:replace="~{fragments/layout :: breadcrumb('관리자', '게시판', 'AI News 관리')}"></div>
        <!-- 브레드크럼 끝 -->

        <!-- 페이지 헤더 시작 -->
        <section class="page-head">
            <h1>AI News 관리</h1>
            <p>AI News 원고와 게시 상태를 관리합니다.</p>
        </section>
        <!-- 페이지 헤더 끝 -->

        <!-- 알림 시작 -->
        <div class="alert alert-success" th:if="${message}" th:text="${message}">크롤링 완료 메시지</div>
        <th:block th:if="${aiNewsSavedMessage != null}">
            <script th:inline="javascript">
                window.addEventListener('DOMContentLoaded', function () {
                    alert(/*[[${aiNewsSavedMessage}]]*/'저장되었습니다.');
                });
            </script>
        </th:block>
        <!-- 알림 끝 -->

        <!-- 검색 시작 -->
        <form class="search-panel news-search-panel" method="get" th:action="@{/admin/board/ai-news/list.do}">
            <div class="news-search-row">
                <span class="search-label">게시일자</span>
                <div class="news-search-range">
                    <input class="form-control news-date-input" type="date" name="dateFrom" th:value="${dateFrom}" data-date-default="start">
                    <span class="date-separator">~</span>
                    <input class="form-control news-date-input" type="date" name="dateTo" th:value="${dateTo}" data-date-default="end">
                </div>
            </div>
            <div class="news-search-row">
                <span class="search-label">상태</span>
                <div class="news-search-statuses">
                    <label class="search-checkbox" th:each="option : ${statusOptions}">
                        <input type="checkbox" name="statuses" th:value="${option.code}" th:checked="${#lists.contains(page.search.statuses(), option.code)}">
                        <span th:text="${option.label}">대기</span>
                    </label>
                </div>
            </div>
            <div class="news-search-row news-search-keyword-row">
                <label class="search-label" for="newsKeywordType">검색조건</label>
                <select class="form-control news-search-select" id="newsKeywordType" name="keywordType">
                    <option value="all">전체</option>
                    <option value="title">제목</option>
                    <option value="tag">태그</option>
                    <option value="status">상태</option>
                </select>
                <label class="search-label" for="newsKeyword">검색어</label>
                <input class="form-control news-search-keyword" id="newsKeyword" name="keyword" th:value="${keyword}">
                <div class="news-search-actions">
                    <button class="btn btn-register btn-sm news-search-submit" type="submit">검색</button>
                    <a class="btn btn-neutral btn-sm news-search-reset" th:href="@{/admin/board/ai-news/list.do}">초기화</a>
                </div>
            </div>
        </form>
        <!-- 검색 끝 -->

        <!-- 목록 상단 버튼 시작 -->
        <div class="list-action-bar">
            <form class="crawl-form" method="post" th:action="@{/admin/board/ai-news/crawl.do}">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-neutral btn-sm" type="submit" onclick="return confirm('레거시 JSON 파일을 읽어 AI News를 DB에 반영하시겠습니까?');">크롤링</button>
            </form>
            <a class="btn btn-register" th:href="@{/admin/board/ai-news/write.do}">등록</a>
        </div>
        <!-- 목록 상단 버튼 끝 -->

        <!-- 리스트 시작 -->
        <section class="content-panel no-pad">
            <div class="panel-head">
                <h2>AI News 목록</h2>
                <span th:text="|${totalCount ?: 0}개|">0개</span>
            </div>
            <div class="table-scroll">
                <table>
                    <thead>
                    <tr>
                        <th>순번</th>
                        <th>제목</th>
                        <th>상태</th>
                        <th>게시일</th>
                        <th>수정일</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="news, stat : ${newsList}">
                        <td th:text="${stat.count}">1</td>
                        <td>
                            <a th:href="@{/admin/board/ai-news/write.do(newsSeq=${news.id})}" th:text="${news.title}">제목</a>
                        </td>
                        <td>
                            <span class="badge badge-info" th:text="${news.statusText}">게시</span>
                        </td>
                        <td th:text="${news.publishedDate}">2026-05-23</td>
                        <td th:text="${news.updatedDate}">2026-05-23</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(newsList)}">
                        <td colspan="5" class="empty">현재 등록된 내용이 없습니다.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
        <!-- 리스트 끝 -->


</th:block>
</body>
</html>
