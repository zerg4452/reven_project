<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('설문 이력 상세')}"></head>
<body>
<!-- screen: 설문 이력 상세 / purpose: 제출 당시 설문 스냅샷과 답변 확인, 상태 변경과 메모 저장 / created: 2026-05-23 -->
<header th:replace="~{fragments/layout :: gnb('survey')}"></header>
<div class="admin-shell">
    <aside th:replace="~{fragments/layout :: lnb('submissions')}"></aside>
    <main class="admin-content">
        <div th:replace="~{fragments/layout :: breadcrumb('관리자', '설문 운영', '설문 이력 상세')}"></div>
        <section class="page-head"><h1>설문 이력 상세</h1><p>제출 당시 저장된 설문과 답변을 확인하고 상태를 관리합니다.</p></section>
        <section class="content-panel">
            <dl class="detail-list">
                <dt>설문명</dt><dd th:text="${submission?.surveyTitle}">설문명</dd>
                <dt>제출자명</dt><dd th:text="${submission?.submitterName}">제출자</dd>
                <dt>연락처</dt><dd th:text="${submission?.phone}">010-0000-0000</dd>
                <dt>상태</dt><dd><span class="badge badge-info" th:text="${submission?.statusText}">신규</span></dd>
                <dt>제출일</dt><dd th:text="${submission?.submittedDate}">2026-05-23</dd>
            </dl>
        </section>
        <section class="content-panel">
            <div class="panel-head"><h2>답변 내용</h2></div>
            <dl class="answer-list">
                <div th:each="answer : ${submission?.answers}">
                    <dt th:text="${answer.fieldLabel}">문항</dt>
                    <dd th:text="${answer.answerValue}">답변</dd>
                </div>
            </dl>
        </section>
        <form class="form-stack survey-admin-form" method="post"
              th:action="@{/admin/survey-submissions/update.do(submitUid=${submission.submitUid})}">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <section class="content-panel">
                <div class="panel-head"><h2>관리</h2></div>
                <div th:if="${updateErrors != null}" class="form-error-summary">
                    <span th:each="err : ${updateErrors.allErrors}" th:text="${err.defaultMessage}"></span>
                </div>
                <label>상태
                    <select class="form-control" name="status">
                        <option value="new"       th:selected="${submission?.status == 'new'}">신규</option>
                        <option value="reviewing" th:selected="${submission?.status == 'reviewing'}">확인중</option>
                        <option value="contacted" th:selected="${submission?.status == 'contacted'}">연락완료</option>
                        <option value="done"      th:selected="${submission?.status == 'done'}">처리완료</option>
                        <option value="hold"      th:selected="${submission?.status == 'hold'}">보류</option>
                    </select>
                </label>
                <label>메모
                    <textarea class="form-control" name="adminMemo" rows="4"
                              maxlength="2000" th:text="${submission?.adminMemo}"></textarea>
                </label>
            </section>
            <div class="detail-action-bar">
                <a class="btn btn-neutral" th:href="@{/admin/survey-submissions/list.do}">목록</a>
                <button class="btn btn-edit" type="submit">저장</button>
            </div>
        </form>
    </main>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
