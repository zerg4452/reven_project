<!-- screen: 설문 이력 관리 / purpose: 제출된 설문 이력을 검색하고 목록으로 확인하는 화면 / created: 2026-05-23 -->
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin}">
<head>
    <title layout:fragment="title">설문 이력 관리</title>
</head>
<body>
<th:block layout:fragment="content">


        <!-- 브레드크럼 시작 -->
        <div th:replace="~{fragments/layout :: breadcrumb('관리자', '설문 운영', '설문 이력 관리')}"></div>
        <!-- 브레드크럼 끝 -->

        <!-- 페이지 헤더 시작 -->
        <section class="page-head">
            <h1>설문 이력 관리</h1>
            <p>사용자가 제출한 설문 이력을 확인합니다.</p>
        </section>
        <!-- 페이지 헤더 끝 -->

        <!-- 검색 시작 -->
        <form class="search-panel news-search-panel" method="get" th:action="@{/admin/survey-submissions/list.do}">
            <div class="news-search-row">
                <span class="search-label">제출일자</span>
                <div class="news-search-range">
                    <input class="form-control news-date-input" type="date" name="startDate" th:value="${dateFrom}" data-date-default="start">
                    <span class="date-separator">~</span>
                    <input class="form-control news-date-input" type="date" name="endDate" th:value="${dateTo}" data-date-default="end">
                </div>
            </div>
            <div class="news-search-row">
                <span class="search-label">상태</span>
                <div class="news-search-statuses">
                    <label class="search-checkbox" th:each="option : ${statusOptions}">
                        <input type="checkbox" name="statuses" th:value="${option.code}" th:checked="${#lists.contains(statuses, option.code)}">
                        <span th:text="${option.label}">접수</span>
                    </label>
                </div>
            </div>
            <div class="news-search-row news-search-keyword-row">
                <label class="search-label" for="historyKeywordType">검색조건</label>
                <select class="form-control news-search-select" id="historyKeywordType" name="keywordType">
                    <option value="전체" th:selected="${keywordType == '전체'}">전체</option>
                    <option value="설문명" th:selected="${keywordType == '설문명'}">설문명</option>
                    <option value="작성자명" th:selected="${keywordType == '작성자명'}">작성자명</option>
                </select>
                <label class="search-label" for="historyKeyword">검색어</label>
                <input class="form-control news-search-keyword" id="historyKeyword" name="keyword" th:value="${keyword}">
                <div class="news-search-actions">
                    <button class="btn btn-register btn-sm news-search-submit" type="submit">검색</button>
                    <a class="btn btn-neutral btn-sm news-search-reset" th:href="@{/admin/survey-submissions/list.do}">초기화</a>
                </div>
            </div>
        </form>
        <!-- 검색 끝 -->

        <!-- 리스트 시작 -->
        <section class="content-panel no-pad">
            <div class="panel-head">
                <h2>설문 이력 목록</h2>
                <span th:text="|${totalCount ?: 0}개|">0개</span>
            </div>
            <div class="table-scroll">
                <table>
                    <thead>
                    <tr>
                        <th>순번</th>
                        <th>설문명</th>
                        <th>제출자명</th>
                        <th>연락처</th>
                        <th>상태</th>
                        <th>제출일</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item, stat : ${submissions}">
                        <td th:text="${stat.count}">1</td>
                        <td><a th:href="@{/admin/survey-submissions/detail.do(submitUid=${item.submitUid})}" th:text="${item.surveyTitle}">설문명</a></td>
                        <td><a th:href="@{/admin/survey-submissions/detail.do(submitUid=${item.submitUid})}" th:text="${item.submitterName}">제출자명</a></td>
                        <td th:text="${item.phone}">010-0000-0000</td>
                        <td><span class="badge badge-info" th:text="${item.statusText}">접수</span></td>
                        <td th:text="${item.submittedDate}">2026-05-23</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(submissions)}">
                        <td colspan="6" class="empty">현재 등록된 내용이 없습니다.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
        <!-- 리스트 끝 -->


</th:block>
</body>
</html>
