<!-- screen: 설문 관리 / purpose: 설문 마스터를 검색하고 목록으로 관리하는 화면 / created: 2026-05-23 -->
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin}">
<head>
    <title layout:fragment="title">설문 관리</title>
</head>
<body>
<th:block layout:fragment="content">


        <!-- 브레드크럼 시작 -->
        <div th:replace="~{fragments/layout :: breadcrumb('관리자', '설문 운영', '설문 관리')}"></div>
        <!-- 브레드크럼 끝 -->

        <!-- 저장 알림 시작 -->
        <th:block th:if="${surveySavedMessage != null}">
            <script th:inline="javascript">
                window.addEventListener('DOMContentLoaded', function () {
                    alert(/*[[${surveySavedMessage}]]*/'저장되었습니다.');
                });
            </script>
        </th:block>
        <!-- 저장 알림 끝 -->

        <!-- 페이지 헤더 시작 -->
        <section class="page-head">
            <h1>설문 관리</h1>
            <p>설문 제목, 문항 수, 사용여부를 관리합니다.</p>
        </section>
        <!-- 페이지 헤더 끝 -->

        <!-- 검색 시작 -->
        <form class="search-panel news-search-panel" method="get" th:action="@{/admin/surveys/list.do}">
            <div class="news-search-row">
                <span class="search-label">등록일자</span>
                <div class="news-search-range">
                    <input class="form-control news-date-input" type="date" name="startDate" th:value="${dateFrom}" data-date-default="start">
                    <span class="date-separator">~</span>
                    <input class="form-control news-date-input" type="date" name="endDate" th:value="${dateTo}" data-date-default="end">
                </div>
            </div>
            <div class="news-search-row news-search-keyword-row">
                <label class="search-label" for="useYn">사용여부</label>
                <select class="form-control news-search-select" id="useYn" name="useYn">
                    <option value="" th:selected="${useYn == null or useYn == ''}">전체</option>
                    <option value="Y" th:selected="${useYn == 'Y'}">사용</option>
                    <option value="N" th:selected="${useYn == 'N'}">미사용</option>
                </select>
                <label class="search-label" for="keywordType">검색조건</label>
                <select class="form-control news-search-select" id="keywordType" name="keywordType">
                    <option value="전체" th:selected="${keywordType == '전체'}">전체</option>
                    <option value="설문명" th:selected="${keywordType == '설문명'}">설문명</option>
                </select>
                <label class="search-label" for="keyword">검색어</label>
                <input class="form-control news-search-keyword" id="keyword" name="keyword" th:value="${keyword}">
                <div class="news-search-actions">
                    <button class="btn btn-register btn-sm news-search-submit" type="submit">검색</button>
                    <a class="btn btn-neutral btn-sm news-search-reset" th:href="@{/admin/surveys/list.do}">초기화</a>
                </div>
            </div>
        </form>
        <!-- 검색 끝 -->

        <!-- 목록 상단 버튼 시작 -->
        <div class="list-action-bar">
            <a class="btn btn-register" th:href="@{/admin/surveys/write.do}">등록</a>
        </div>
        <!-- 목록 상단 버튼 끝 -->

        <!-- 리스트 시작 -->
        <section class="content-panel no-pad">
            <div class="panel-head">
                <h2>설문 목록</h2>
                <span th:text="|${totalCount ?: 0}개|">0개</span>
            </div>
            <div class="table-scroll">
                <table>
                    <thead>
                    <tr>
                        <th>순번</th>
                        <th>설문 제목</th>
                        <th>문항 수</th>
                        <th>사용여부</th>
                        <th>등록일</th>
                        <th>수정일</th>
                        <th>관리</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="survey, stat : ${surveys}">
                        <td th:text="${stat.count}">1</td>
                        <td><a th:href="@{/admin/surveys/write.do(surveyUid=${survey.surveyUid})}" th:text="${survey.title}">설문 제목</a></td>
                        <td th:text="${survey.fieldCount}">0</td>
                        <td><span class="badge" th:classappend="${survey.enabled} ? ' badge-success' : ' badge-muted'" th:text="${survey.enabled} ? '사용' : '미사용'">사용</span></td>
                        <td th:text="${survey.createdDate}">2026-05-23</td>
                        <td th:text="${survey.updatedDate}">2026-05-23</td>
                        <td>
                            <a class="btn btn-neutral btn-sm" th:href="@{/admin/surveys/{uid}/statistics.do(uid=${survey.surveyUid})}">통계</a>
                            <a class="btn btn-neutral btn-sm" th:href="@{/admin/surveys/copy.do(surveyUid=${survey.surveyUid})}">복사</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(surveys)}">
                        <td colspan="7" class="empty">현재 등록된 내용이 없습니다.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
        <!-- 리스트 끝 -->


</th:block>
</body>
</html>
