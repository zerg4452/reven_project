<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('설문 관리')}"></head>
<body>
<!-- screen: 설문 관리 / purpose: 설문 마스터를 검색하고 목록으로 관리하는 화면 / created: 2026-05-23 -->
<header th:replace="~{fragments/layout :: gnb('survey')}"></header>
<div class="admin-shell">
    <aside th:replace="~{fragments/layout :: lnb('surveys')}"></aside>
    <main class="admin-content">
        <div th:replace="~{fragments/layout :: breadcrumb('관리자', '설문 운영', '설문 관리')}"></div>
        <section class="page-head">
            <h1>설문 관리</h1>
            <p>설문 제목, 문항 수, 사용여부를 관리합니다.</p>
        </section>
        <form class="search-panel" method="get" th:action="@{/admin/surveys/list.do}">
            <div class="search-row">
                <span class="search-label">등록일자</span>
                <input class="form-control" type="date" name="startDate" th:value="${dateFrom}" data-date-default="start">
                <span class="date-separator">~</span>
                <input class="form-control" type="date" name="endDate" th:value="${dateTo}" data-date-default="end">
            </div>
            <div class="search-row">
                <label class="search-label" for="keywordType">검색조건</label>
                <select class="form-control" id="keywordType" name="keywordType">
                    <option value="전체" th:selected="${keywordType == '전체'}">전체</option>
                    <option value="설문명" th:selected="${keywordType == '설문명'}">설문명</option>
                </select>
                <label class="search-label" for="keyword">검색어</label>
                <input class="form-control search-keyword" id="keyword" name="keyword" th:value="${keyword}">
                <button class="btn btn-register" type="submit">검색</button>
                <a class="btn btn-neutral" th:href="@{/admin/surveys/list.do}">초기화</a>
            </div>
        </form>
        <div class="list-action-bar"><a class="btn btn-register" th:href="@{/admin/surveys/write.do}">설문 등록</a></div>
        <section class="content-panel no-pad">
            <div class="panel-head">
                <h2>설문 목록</h2>
                <span th:text="|${totalCount ?: 0}개|">0개</span>
            </div>
            <div class="table-scroll">
                <table>
                    <thead>
                    <tr><th>순번</th><th>설문 제목</th><th>문항 수</th><th>사용여부</th><th>등록일</th><th>수정일</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="survey, stat : ${surveys}">
                        <td th:text="${stat.count}">1</td>
                        <td><a th:href="@{/admin/surveys/write.do(surveyUid=${survey.surveyUid})}" th:text="${survey.title}">설문 제목</a></td>
                        <td th:text="${survey.fieldCount}">0</td>
                        <td><span class="badge" th:classappend="${survey.enabled} ? ' badge-success' : ' badge-muted'" th:text="${survey.enabled} ? '사용' : '미사용'">사용</span></td>
                        <td th:text="${survey.createdDate}">2026-05-23</td>
                        <td th:text="${survey.updatedDate}">2026-05-23</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(surveys)}"><td colspan="6" class="empty">현재 등록된 내용이 없습니다.</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
