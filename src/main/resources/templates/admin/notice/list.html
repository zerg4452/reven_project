<!-- screen: 공지사항 관리 / purpose: 공지사항을 목록으로 관리하고 상단 고정/노출을 확인하는 화면 / created: 2026-05-31 -->
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin}">
<head>
    <title layout:fragment="title">공지사항 관리</title>
</head>
<body>
<th:block layout:fragment="content">


        <!-- 브레드크럼 시작 -->
        <div th:replace="~{fragments/layout :: breadcrumb('관리자', '게시판', '공지사항 관리')}"></div>
        <!-- 브레드크럼 끝 -->

        <!-- 알림 시작 -->
        <div class="alert" th:if="${error}" th:text="${error}">오류가 발생했습니다.</div>
        <th:block th:if="${noticeSavedMessage != null}">
            <script th:inline="javascript">
                window.addEventListener('DOMContentLoaded', function () {
                    alert(/*[[${noticeSavedMessage}]]*/'저장되었습니다.');
                });
            </script>
        </th:block>
        <!-- 알림 끝 -->

        <!-- 페이지 헤더 시작 -->
        <section class="page-head">
            <h1>공지사항 관리</h1>
            <p>공지 등록과 상단 고정, 노출 여부를 관리합니다.</p>
        </section>
        <!-- 페이지 헤더 끝 -->

        <!-- 검색 시작 -->
        <form class="search-panel news-search-panel" method="get" th:action="@{/admin/board/notice/list.do}">
            <div class="news-search-row">
                <span class="search-label">게시일자</span>
                <div class="news-search-range">
                    <input class="form-control news-date-input" type="date" name="dateFrom" th:value="${dateFrom}" data-date-default="start">
                    <span class="date-separator">~</span>
                    <input class="form-control news-date-input" type="date" name="dateTo" th:value="${dateTo}" data-date-default="end">
                </div>
                <div class="news-search-actions">
                    <button class="btn btn-register btn-sm news-search-submit" type="submit">검색</button>
                    <a class="btn btn-neutral btn-sm news-search-reset" th:href="@{/admin/board/notice/list.do}">초기화</a>
                </div>
            </div>
        </form>
        <!-- 검색 끝 -->

        <!-- 목록 상단 버튼 시작 -->
        <div class="list-action-bar">
            <a class="btn btn-register" th:href="@{/admin/board/notice/write.do}">등록</a>
        </div>
        <!-- 목록 상단 버튼 끝 -->

        <!-- 리스트 시작 -->
        <section class="content-panel no-pad">
            <div class="panel-head">
                <h2>공지사항 목록</h2>
                <span th:text="|${totalCount ?: 0}개|">0개</span>
            </div>
            <div class="table-scroll">
                <table>
                    <thead>
                    <tr>
                        <th>순번</th>
                        <th>고정</th>
                        <th>제목</th>
                        <th>게시일</th>
                        <th>노출여부</th>
                        <th>조회수</th>
                        <th>수정일</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="notice, stat : ${noticeList}" th:classappend="${notice.pinned()} ? ' notice-row-pinned'">
                        <td th:text="${stat.count}">1</td>
                        <td>
                            <span class="badge badge-warning" th:if="${notice.pinned()}">고정</span>
                        </td>
                        <td>
                            <a th:href="@{/admin/board/notice/write.do(noticeSeq=${notice.noticeSeq})}" th:text="${notice.title}">제목</a>
                        </td>
                        <td th:text="${notice.publishDate}">2026-05-31</td>
                        <td>
                            <span class="badge badge-info" th:text="${notice.publishText()}">노출</span>
                        </td>
                        <td th:text="${notice.viewCnt}">0</td>
                        <td th:text="${notice.updatedDate}">2026-05-31</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(noticeList)}">
                        <td colspan="7" class="empty">현재 등록된 내용이 없습니다.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
        <!-- 리스트 끝 -->


</th:block>
</body>
</html>
