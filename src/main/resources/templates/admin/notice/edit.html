<!-- screen: 공지사항 등록/수정 / purpose: 공지 제목, 내용, 게시일, 노출/고정, 썸네일, 첨부를 입력하는 화면 / created: 2026-05-31 -->
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin}">
<head>
    <title layout:fragment="title" th:text="${notice?.noticeSeq} != null ? '공지사항 수정' : '공지사항 등록'">공지사항 등록</title>
</head>
<body>
<th:block layout:fragment="content">


        <!-- 브레드크럼 시작 -->
        <div th:replace="~{fragments/layout :: breadcrumb('관리자', '게시판', ${notice?.noticeSeq} != null ? '공지사항 수정' : '공지사항 등록')}"></div>
        <!-- 브레드크럼 끝 -->

        <!-- 알림 시작 -->
        <div class="alert" th:if="${error}" th:text="${error}">오류가 발생했습니다.</div>
        <!-- 알림 끝 -->

        <!-- 페이지 헤더 시작 -->
        <section class="page-head">
            <h1 th:text="${notice?.noticeSeq} != null ? '공지사항 수정' : '공지사항 등록'">공지사항 등록</h1>
            <p>제목, 내용, 게시일, 노출/고정 여부와 썸네일·첨부 파일을 관리합니다.</p>
        </section>
        <!-- 페이지 헤더 끝 -->

        <!-- 등록/수정 폼 시작 -->
        <form class="form-stack notice-upload-form"
              method="post"
              enctype="multipart/form-data"
              data-notice-upload-form
              data-notice-max-files="10"
              th:action="${notice?.noticeSeq} != null ? @{/admin/board/notice/update.do(noticeSeq=${notice.noticeSeq})} : @{/admin/board/notice/insert.do}">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="noticeSeq" th:value="${notice?.noticeSeq}">
            <section class="content-panel">
                <label>제목 <span class="required">*</span>
                    <input class="form-control" name="title" th:value="${formTitle != null ? formTitle : notice?.title}" required>
                </label>
                <label>게시일 <span class="required">*</span>
                    <input class="form-control" type="datetime-local" name="publishDtm"
                           th:value="${formPublishDtm != null
                                ? #temporals.format(formPublishDtm, 'yyyy-MM-dd''T''HH:mm')
                                : (notice?.publishDtm != null
                                    ? #temporals.format(notice.publishDtm, 'yyyy-MM-dd''T''HH:mm')
                                    : #temporals.format(#temporals.createNow(), 'yyyy-MM-dd''T''HH:mm'))}" required>
                    <span class="form-hint">게시일이 현재 시각 이후이면 사용자 화면에 노출되지 않습니다(예약 게시).</span>
                </label>
                <label>노출여부
                    <select class="form-control" name="publishYn">
                        <option value="Y"
                                th:selected="${(formPublishYn != null ? formPublishYn : notice?.publishYn) == 'Y'}">노출</option>
                        <option value="N"
                                th:selected="${(formPublishYn != null ? formPublishYn : notice?.publishYn) == null or (formPublishYn != null ? formPublishYn : notice?.publishYn) == 'N'}">대기</option>
                    </select>
                </label>
                <label>상단 고정
                    <select class="form-control" name="pinYn">
                        <option value="N"
                                th:selected="${(formPinYn != null ? formPinYn : notice?.pinYn) == null or (formPinYn != null ? formPinYn : notice?.pinYn) == 'N'}">일반</option>
                        <option value="Y"
                                th:selected="${(formPinYn != null ? formPinYn : notice?.pinYn) == 'Y'}">고정</option>
                    </select>
                </label>
                <label>내용
                    <textarea class="form-control" name="content" rows="12" th:text="${formContent != null ? formContent : notice?.content}"></textarea>
                </label>
            </section>
            <section class="content-panel">
                <div class="panel-head">
                    <h2>썸네일</h2>
                </div>
                <p class="form-hint">이미지 1장만 등록할 수 있습니다. 새 파일을 선택하면 기존 썸네일을 교체합니다.</p>
                <div class="notice-thumbnail-current" th:if="${thumbnail != null}">
                    <img th:src="${thumbnail.fileUrl}" th:alt="${thumbnail.originalFileName}" class="notice-thumbnail-image">
                    <span th:text="${thumbnail.originalFileName}">현재 썸네일</span>
                </div>
                <label class="notice-upload-field">썸네일 이미지
                    <input class="form-control" type="file" name="thumbnailFile" accept="image/*" data-notice-thumb-input>
                </label>
                <div class="notice-thumbnail-preview" data-notice-thumb-preview></div>
            </section>
            <section class="content-panel notice-attachment-panel">
                <div class="panel-head notice-attachment-head">
                    <h2>첨부 파일</h2>
                    <span class="notice-selection-count" data-notice-selection-count>현재 0/10</span>
                </div>
                <p class="notice-selection-notice">체크 해제 시 저장에서 제외됩니다.</p>
                <section class="notice-existing-section" th:if="${notice?.noticeSeq != null}">
                    <h3 class="notice-section-title">현재 첨부</h3>
                    <div class="notice-file-grid" data-notice-existing-list>
                        <article class="notice-file-card" th:each="file : ${attachments}">
                            <label class="notice-file-card-select">
                                <input type="checkbox"
                                       name="keepAttachFileSeqs"
                                       th:value="${file.noticeFileSeq}"
                                       checked
                                       data-notice-existing-checkbox>
                                <span>저장 포함</span>
                            </label>
                            <strong class="notice-file-name" th:text="${file.originalFileName}">파일명</strong>
                            <span class="notice-file-size" th:text="${file.displayFileSizeKb()}">1 KB</span>
                            <a class="btn btn-neutral btn-sm"
                               th:href="@{/admin/board/notice/download.do(noticeFileSeq=${file.noticeFileSeq})}">원본 다운로드</a>
                        </article>
                    </div>
                    <p class="empty" th:if="${#lists.isEmpty(attachments)}">등록된 첨부 파일이 없습니다.</p>
                </section>
                <label class="notice-upload-field">추가 첨부
                    <input class="form-control"
                           type="file"
                           name="uploadFiles"
                           data-notice-upload-input
                           multiple>
                </label>
                <p class="form-hint">이미지·문서(pdf, hwp, doc, xls, ppt, zip 등)를 첨부할 수 있으며, 유지/추가 합계 최대 10개까지 가능합니다.</p>
                <div class="notice-file-grid" data-notice-new-list></div>
            </section>
            <div class="detail-action-bar">
                <a class="btn btn-neutral"
                   th:href="@{/admin/board/notice/list.do(dateFrom=${listDateFrom}, dateTo=${listDateTo}, page=${listPage})}">목록</a>
                <div>
                    <button class="btn btn-delete" type="submit" th:if="${notice?.noticeSeq != null}"
                            th:formaction="@{/admin/board/notice/delete.do(noticeSeq=${notice.noticeSeq})}"
                            data-notice-delete-button
                            onclick="return confirm('이 공지사항을 삭제하시겠습니까?');">삭제</button>
                    <button class="btn"
                            th:classappend="${notice?.noticeSeq != null} ? ' btn-edit' : ' btn-register'"
                            type="submit"
                            th:text="${notice?.noticeSeq != null} ? '수정' : '등록'">저장</button>
                </div>
            </div>
        </form>
        <!-- 등록/수정 폼 끝 -->


</th:block>
<th:block layout:fragment="pageScripts">
<script th:src="@{/admin/js/notice-edit.js}" defer></script>
</th:block>
</body>
</html>
