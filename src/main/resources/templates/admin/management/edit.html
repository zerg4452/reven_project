<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${adminSeq} != null ? '관리자 상세' : '관리자 등록')}"></head>
<body>
<!-- screen: 관리자 상세 / purpose: 관리자 계정과 사용 상태를 등록하거나 수정하는 화면 / created: 2026-05-23 -->
<header th:replace="~{fragments/layout :: gnb('management')}"></header>
<div class="admin-shell">
    <aside th:replace="~{fragments/layout :: lnb('management')}"></aside>
    <main class="admin-content">
        <div th:replace="~{fragments/layout :: breadcrumb('관리자', '관리자 관리', ${adminSeq} != null ? '관리자 상세' : '관리자 등록')}"></div>
        <section class="page-head"><h1 th:text="${adminSeq} != null ? '관리자 상세' : '관리자 등록'">관리자 상세</h1><p>관리자 계정 정보를 편집합니다.</p></section>
        <div class="alert" th:if="${error}" th:text="${error}">오류가 발생했습니다.</div>
        <form class="form-stack management-admin-form" method="post" th:action="${adminSeq} != null ? @{/admin/management/update.do(adminSeq=${adminSeq})} : @{/admin/management/insert.do}">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="adminSeq" th:value="${adminSeq}">
            <section class="content-panel management-admin-fields">
                <div class="management-admin-field">
                    <label for="admin-username">아이디 <span class="required">*</span></label>
                    <input id="admin-username" class="form-control" name="loginId" th:value="${admin?.loginId}" th:readonly="${adminSeq != null}" th:required="${adminSeq == null}">
                </div>
                <div class="management-admin-field">
                    <label for="admin-name">이름</label>
                    <input id="admin-name" class="form-control" name="name" th:value="${admin?.name}">
                </div>
                <div class="management-admin-field">
                    <label for="admin-password">비밀번호</label>
                    <input id="admin-password" class="form-control" type="password" name="password" autocomplete="new-password" th:required="${adminSeq == null}">
                </div>
                <div class="management-admin-field">
                    <label for="admin-enabled">사용여부</label>
                    <select id="admin-enabled" class="form-control" name="status">
                        <option value="active" th:selected="${admin == null or admin.status == 'active'}">사용</option>
                        <option value="inactive" th:selected="${admin?.status == 'inactive'}">미사용</option>
                    </select>
                </div>
            </section>
            <div class="detail-action-bar">
                <a class="btn btn-neutral" th:href="@{/admin/management/list.do}">목록</a>
                <div>
                    <button class="btn btn-delete" type="submit"
                            th:if="${adminSeq != null}"
                            th:formaction="@{/admin/management/delete.do(adminSeq=${adminSeq})}"
                            onclick="return confirm('이 관리자를 삭제하시겠습니까?');">삭제</button>
                    <button class="btn btn-edit" type="submit" th:text="${adminSeq} != null ? '수정' : '등록'">저장</button>
                </div>
            </div>
        </form>
    </main>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
