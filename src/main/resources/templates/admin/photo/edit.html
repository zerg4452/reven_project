<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${photo?.photoSeq} != null ? '포토게시판 수정' : '포토게시판 등록')}"></head>
<body>
<!-- screen: 포토게시판 등록/수정 / purpose: 사진 게시글 제목, 첨부 파일, 게시여부를 입력하는 화면 / created: 2026-05-27 -->
<header th:replace="~{fragments/layout :: gnb('board')}"></header>
<div class="admin-shell">
    <aside th:replace="~{fragments/layout :: lnb('board')}"></aside>
    <main class="admin-content">
        <div th:replace="~{fragments/layout :: breadcrumb('관리자', '게시판', ${photo?.photoSeq} != null ? '포토게시판 수정' : '포토게시판 등록')}"></div>
        <section class="page-head">
            <h1 th:text="${photo?.photoSeq} != null ? '포토게시판 수정' : '포토게시판 등록'">포토게시판 등록</h1>
            <p>제목, 첨부 파일, 게시 여부만 관리합니다.</p>
        </section>
        <form class="form-stack" method="post" enctype="multipart/form-data"
              th:action="${photo?.photoSeq} != null ? @{/admin/board/photo/update.do(photoSeq=${photo.photoSeq})} : @{/admin/board/photo/insert.do}">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="photoSeq" th:value="${photo?.photoSeq}">
            <section class="content-panel">
                <label>제목 <span class="required">*</span>
                    <input class="form-control" name="title" th:value="${photo?.title}" required>
                </label>
                <label>게시여부
                    <select class="form-control" name="publishYn">
                        <option value="Y" th:selected="${photo?.publishYn == null or photo?.publishYn == 'Y'}">게시</option>
                        <option value="N" th:selected="${photo?.publishYn == 'N'}">대기</option>
                    </select>
                </label>
                <label>첨부 파일
                    <input class="form-control" type="file" name="uploadFiles" accept="image/*,.gif,.webp,.mp4,video/mp4" multiple>
                </label>
                <p class="form-hint">신규 등록 시 최소 1개 이상의 파일이 필요하며, 이미지, GIF, WEBP, MP4 파일만 업로드할 수 있고 최대 5장까지 가능합니다.</p>
            </section>
            <section class="content-panel" th:if="${photo?.photoSeq != null}">
                <div class="panel-head"><h2>현재 첨부 파일</h2><span th:text="|${#lists.size(photoFiles)}개|">0개</span></div>
                <div class="photo-file-grid">
                    <article class="photo-file-card" th:each="file : ${photoFiles}">
                        <div class="photo-file-preview">
                            <img th:if="${file.contentType != null and file.contentType.startsWith('image/')}" th:src="${file.fileUrl}" th:alt="${file.originalFileName}">
                            <video th:if="${file.contentType == 'video/mp4'}" th:src="${file.fileUrl}" controls></video>
                            <a th:if="${file.contentType == null or (!file.contentType.startsWith('image/') and file.contentType != 'video/mp4')}"
                               class="btn btn-neutral btn-sm"
                               th:href="${file.fileUrl}">다운로드</a>
                        </div>
                        <strong th:text="${file.originalFileName}">파일명</strong>
                    </article>
                </div>
            </section>
            <div class="detail-action-bar">
                <a class="btn btn-neutral" th:href="@{/admin/board/photo/list.do}">목록</a>
                <div>
                    <button class="btn btn-delete" type="submit" th:if="${photo?.photoSeq != null}"
                            th:formaction="@{/admin/board/photo/delete.do(photoSeq=${photo.photoSeq})}"
                            onclick="return confirm('이 사진 게시글을 삭제하시겠습니까?');">삭제</button>
                    <button class="btn btn-edit" type="submit" th:text="${photo?.photoSeq != null} ? '수정' : '등록'">저장</button>
                </div>
            </div>
        </form>
    </main>
</div>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
