spring:
  application:
    name: reven-project
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 260MB
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:survey_app}?useUnicode=true&characterEncoding=utf8
    username: ${DB_USER:survey_user}
    password: ${DB_PASSWORD:survey_pass}
  sql:
    init:
      mode: always
      encoding: UTF-8
  thymeleaf:
    cache: false
  jackson:
    time-zone: Asia/Seoul

server:
  port: 8080
  servlet:
    session:
      timeout: 120m

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.reven.project
  configuration:
    map-underscore-to-camel-case: true

reven:
  timezone: Asia/Seoul
  admin:
    default-login-id: admin
    default-password: admin123
  upload:
    photo:
      root-path: ./storage/photo-board
      base-url: /admin/board/photo/file.do
      max-files: 5
      max-image-size-mb: 20
      max-video-size-mb: 50
    notice:
      root-path: ./storage/notice-board
      base-url: /admin/board/notice/file.do
      max-attachments: 10
      max-thumbnail-size-mb: 5
      max-attachment-size-mb: 20
