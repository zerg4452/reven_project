services:
  mariadb:
    image: mariadb:11.4
    container_name: reven-mariadb
    ports:
      - "3307:3306"
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: survey_app
      MARIADB_USER: survey_user
      MARIADB_PASSWORD: survey_pass
      TZ: Asia/Seoul
    volumes:
      - reven_mariadb_data:/var/lib/mysql
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  reven_mariadb_data:
